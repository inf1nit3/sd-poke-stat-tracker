name: CI

on:
  push:
    branches: [ "main", "refactor/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Run pytest benchmarks
      run: |
        pytest tests/ --benchmark-only

    - name: Run all tests
      run: |
        pytest tests/

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install Frontend Dependencies
      run: pnpm install

    - name: Build Frontend
      run: pnpm run build
